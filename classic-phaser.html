<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>RESPONSE — TRAIN CAR / PLAYTEST</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#dce6e9;font-family:monospace}
#game{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
canvas{display:block;max-width:100%;max-height:100%;image-rendering:pixelated}
#notice{position:absolute;bottom:2px;width:100%;text-align:center;font:8px monospace;color:#607a81;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#7ab7c2;font:12px monospace;background:#000}
</style>
</head>
<body>
<div id="game"></div><div id="loading">RESPONSE // LOADING ASSETS...</div><div id="notice">20XX · SURVIVAL PROTOTYPE · GRAPHICS PHASE 003</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
(()=>{
'use strict';
const W=360,H=640;
const SAVE='response_save_v1';
const initial={step:0,look:false,phone:false,up:false,signal:false,hp:72};
let state={...initial};
try{state={...state,...JSON.parse(localStorage.getItem(SAVE)||'{}')}}catch(e){}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}
const TEXT={
 start:'눈을 떴을 때, 지하철 객차엔 아무도 없었다.\n희미한 형광등만 불규칙하게 깜박인다.',
 look:'잠긴 출입문과 파손된 창문.\n객차 한쪽에서 낡은 라디오가 보인다.',
 phone:'휴대폰: 23:41 / 배터리 18%\n통신 불가. 저장된 메모를 확인할 수 있다.',
 up:'비틀거리며 몸을 일으켰다.\n머리가 아프다. 이곳에서 버텨야 한다.'
};
const ASSETS=['floor_clean','floor_worn','floor_rust','floor_wet','sleep_bed','living_reading_corner','repair_workbench','kitchen_purifier','hvac_heater','window_cracked','door_locked'];
const SITES={
 sleep_bed:{name:'임시 침대',desc:'수면 공간. 상태 관리는 후속 단계에서 적용합니다.'},
 living_reading_corner:{name:'독서·휴식 공간',desc:'책과 라디오. 자동 생활 행동은 후속 단계에서 연결합니다.'},
 repair_workbench:{name:'작업대',desc:'공구와 부품. 시설 수리는 후속 단계에서 적용합니다.'},
 kitchen_purifier:{name:'조리·정수 공간',desc:'음식과 식수 설비. 소비 기능은 후속 단계에서 적용합니다.'},
 hvac_heater:{name:'난방·환기 설비',desc:'객차 온도 조절은 후속 단계에서 적용합니다.'},
 window_cracked:{name:'파손된 창문',desc:'외부는 어둡고 조용합니다.'},
 door_locked:{name:'잠긴 출입문',desc:'열리지 않습니다. 객차 밖 이동은 불가능합니다.'}
};
class Car extends Phaser.Scene{
 constructor(){super('Car');this.message=null;this.selected=null;this.layout=null;}
 preload(){
  this.load.setPath('assets/pixel/');
  ASSETS.forEach(key=>this.load.image(key,key+'.png'));
  this.load.on('loaderror',file=>{console.error('Asset unavailable:',file.key);});
 }
 create(){
  const loading=document.getElementById('loading'); if(loading)loading.remove();
  this.cameras.main.setBackgroundColor('#000000');
  this.drawCar();this.drawCharacter();this.createUI();this.refresh();
  this.events.once(Phaser.Scenes.Events.SHUTDOWN,()=>this.input.removeAllListeners());
 }
 p(x,y,z=0){return{x:110+(x-y)*19,y:157+(x+y)*9.5-z};}
 image(id,x,y,scale=.35,originY=1,depthOffset=0,hit=false){
  const q=this.p(x,y);if(!this.textures.exists(id))return null;
  const sp=this.add.image(Math.round(q.x),Math.round(q.y),id)
   .setOrigin(.5,originY).setScale(scale).setDepth(q.y+depthOffset);
  if(hit&&SITES[id]){
   sp.setInteractive({useHandCursor:true,pixelPerfect:false});
   sp.on('pointerdown',()=>this.inspect(id));
  }
  return sp;
 }
 drawCar(){
  const shadow=this.add.graphics().setDepth(-10);
  shadow.fillStyle(0x10202a,.63);shadow.fillEllipse(183,255,334,141);
  shadow.lineStyle(1,0x23343d,.65);
  for(let x=0;x<12;x++)for(let y=0;y<5;y++){
   const q=this.p(x,y);const edge=y===2;
   const id=(x+y)%13===0?'floor_wet':(x+2*y)%5===0?'floor_rust':(x+3*y)%4===0?'floor_worn':'floor_clean';
   const tile=this.add.image(Math.round(q.x),Math.round(q.y),id)
    .setOrigin(.5,.5).setScale(.31).setDepth(q.y-140);
   if(edge){tile.setTint(0x9cabb1);}
  }
  // Back window panels and locked end doors are structural background objects.
  [2,5,8].forEach(x=>this.image('window_cracked',x,.2,.34,1,-32,true));
  this.image('door_locked',0,.1,.32,1,-20,true);
  this.image('door_locked',11,.1,.32,1,-20,true);
  // Fixed 12x5 layout, Y=2 is the uninterrupted central movement aisle.
  this.image('sleep_bed',2,1.4,.35,1,10,true);
  this.image('living_reading_corner',5,1.4,.33,1,10,true);
  this.image('repair_workbench',8.5,1.4,.34,1,10,true);
  this.image('hvac_heater',10.5,3.6,.3,1,11,true);
  this.image('kitchen_purifier',4.1,3.8,.34,1,11,true);
  const border=this.add.graphics().setDepth(350);
  border.lineStyle(2,0x45545c,.9);
  const frontA=this.p(0,4.85),frontB=this.p(11.8,4.85);
  border.lineBetween(frontA.x,frontA.y+7,frontB.x,frontB.y+7);
  this.add.text(180,336,'CAR 01   //   CENTRAL AISLE: OPEN',{
   fontFamily:'monospace',fontSize:'8px',color:'#587985'
  }).setOrigin(.5).setDepth(360);
 }
 drawCharacter(){
  const pos=this.p(3.3,2);
  this.player=this.add.container(Math.round(pos.x),Math.round(pos.y-3)).setDepth(pos.y+18);
  const g=this.add.graphics();
  g.fillStyle(0x07121c,.7);g.fillEllipse(0,15,18,6);
  g.fillStyle(0x1b2332);g.fillRect(-5,6,4,10);g.fillRect(2,6,4,10);
  g.fillStyle(0xe0ddd3);g.fillRect(-7,-13,14,20);
  g.fillStyle(0x23222c);g.fillTriangle(-1,-11,3,-11,1,3);
  g.fillStyle(0xcfa789);g.fillRect(-5,-24,10,11);
  g.fillStyle(0x1b202a);g.fillRect(-6,-26,12,5);g.fillRect(-7,-23,4,4);
  g.fillStyle(0xe0ddd3);g.fillRect(-10,-8,3,11);g.fillRect(7,-8,3,11);
  this.player.add(g);
  if(state.up)this.player.y-=5;
 }
 createUI(){
  this.add.text(14,8,'RESPONSE',{fontFamily:'monospace',fontSize:'17px',fontStyle:'bold',color:'#e0e8e9'}).setDepth(1200);
  this.add.text(346,11,'20XX / DAY 001',{fontFamily:'monospace',fontSize:'9px',color:'#98bac5'}).setOrigin(1,0).setDepth(1200);
  this.add.rectangle(180,527,356,224,0x0c151e).setStrokeStyle(2,0x3d545f).setDepth(1000);
  this.add.rectangle(180,454,339,65,0x15202a).setStrokeStyle(1,0x405966).setDepth(1001);
  this.add.text(16,415,'[SYSTEM LOG]  23:41',{fontFamily:'monospace',fontSize:'10px',color:'#7ec4d1'}).setDepth(1002);
  this.stat=this.add.text(17,394,'',{fontFamily:'monospace',fontSize:'10px',color:'#b8ccd3'}).setDepth(1002);
  this.log=this.add.text(20,439,'',{fontFamily:'monospace',fontSize:'11px',color:'#dbe6e8',wordWrap:{width:320},lineSpacing:4}).setDepth(1002);
  this.buttons=[];
  ['주변 살피기','휴대폰 확인','일어나기'].forEach((label,i)=>{
   const y=502+i*45;
   const bg=this.add.rectangle(180,y,330,37,0x1b2b38).setStrokeStyle(1,0x59727a).setDepth(1005).setInteractive({useHandCursor:true});
   const txt=this.add.text(30,y-7,'0'+(i+1)+'   '+label,{fontFamily:'monospace',fontSize:'12px',color:'#e2edef'}).setDepth(1006);
   this.add.text(319,y-8,'›',{fontSize:'15px',color:'#72c0cf'}).setDepth(1006);
   bg.on('pointerdown',()=>this.action(i));
   this.buttons.push([bg,txt]);
  });
  this.add.text(343,374,'GRAPHICS TEST 003',{fontFamily:'monospace',fontSize:'9px',color:'#748d98'}).setOrigin(1,0).setDepth(1002);
 }
 inspect(id){this.selected=id;const s=SITES[id];this.message=s.name+'\n'+s.desc;this.refresh();}
 action(i){
  this.selected=null;
  if(i===0){state.look=true;state.step=Math.max(state.step,1);this.message=TEXT.look;}
  if(i===1){state.phone=true;state.step=Math.max(state.step,2);this.message=TEXT.phone;}
  if(i===2){state.up=true;state.step=Math.max(state.step,3);this.message=TEXT.up;if(!this.stood){this.player.y-=5;this.stood=true;}}
  save();this.refresh();
 }
 refresh(){
  this.stat.setText('HP '+state.hp+'/100    BATTERY 18%    SIGNAL LOST');
  this.log.setText(this.message || (state.step===0?TEXT.start:'객차를 둘러본다. 아직 주위는 조용하다.'));
  [state.look,state.phone,state.up].forEach((done,i)=>{this.buttons[i][0].setFillStyle(done?0x1e3c3e:0x1b2b38);this.buttons[i][1].setColor(done?'#88b8b8':'#e2edef');});
 }
}
window.addEventListener('error',e=>{const el=document.getElementById('loading');if(el)el.textContent='RESPONSE // LOAD ERROR: '+e.message;});
if(typeof Phaser==='undefined'){
 document.getElementById('loading').textContent='NETWORK ERROR // PHASER CDN UNAVAILABLE';
 return;
}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,pixelArt:true,roundPixels:true,
 backgroundColor:'#000000',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Car]});
})();
</script>
</body>
</html>
