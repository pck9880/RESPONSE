name: Deploy RESPONSE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages and enable site if missing
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live game URL
        shell: bash
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Checking ${URL}"
          for attempt in $(seq 1 12); do
            STATUS=$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 15 "${URL}" || true)
            if [ "${STATUS}" = "200" ]; then
              echo "RESPONSE online: ${URL}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${STATUS}"
            sleep 10
          done
          echo "Website did not return HTTP 200: ${URL}" >> "${GITHUB_STEP_SUMMARY}"
          exit 1
